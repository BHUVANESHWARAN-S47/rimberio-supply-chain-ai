[alembic]
script_location = backend/app/database/migrations
prepend_sys_path = .
version_path_separator = os

# We read sqlalchemy.url dynamically from backend.app.database.connection in env.py
sqlalchemy.url = sqlite:///backend/data/rimberio_enterprise.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
